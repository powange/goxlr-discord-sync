name: v3 (Rust)

on:
  push:
    branches: [rust/v3]
    tags:
      - 'v3.*'
  pull_request:
    paths: ['crates/**', 'src-tauri/**', 'ui/**', 'Cargo.*', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.12.3
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Version matches the tag
      if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
      run: |
        version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "goxlr-discord-sync") | .version')
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo version $version"
          exit 1
        fi

    - name: Format
      if: runner.os == 'Linux'
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Tests
      run: cargo test --workspace

  # Branch and pull request builds: installers to try, without updater signatures.
  bundle:
    needs: check
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Bundle
      shell: bash
      run: |
        echo '{"bundle": {"createUpdaterArtifacts": false}}' > "$RUNNER_TEMP/no-updater.json"
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --config "$RUNNER_TEMP/no-updater.json"

    - uses: actions/upload-artifact@v7
      with:
        name: bundle-${{ runner.os }}
        path: |
          target/release/bundle/nsis/*.exe
          target/release/bundle/deb/*.deb
          target/release/bundle/appimage/*.AppImage
        if-no-files-found: error

  # Releases (tags v3.*). Code signing is inactive until SignPath is configured
  # (secret SIGNPATH_API_TOKEN + variables SIGNPATH_ORGANIZATION_ID,
  # SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG). The updater signature
  # (secret TAURI_SIGNING_PRIVATE_KEY [+ _PASSWORD]) is required and computed
  # last, on the Authenticode-signed installer.
  release-windows:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      actions: read  # SignPath reads the uploaded artifacts
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Build the application
      shell: bash
      run: npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --no-bundle

    - name: Upload the app for SignPath
      id: unsigned-app
      if: env.SIGNPATH_API_TOKEN != ''
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-app
        path: target/release/goxlr-discord-sync.exe

    - name: Sign the app with SignPath
      if: env.SIGNPATH_API_TOKEN != ''
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
        github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signed-app

    - name: Use the signed app
      if: env.SIGNPATH_API_TOKEN != ''
      shell: pwsh
      run: Copy-Item signed-app/goxlr-discord-sync.exe target/release/goxlr-discord-sync.exe -Force

    # Named GoXLR_Setup.exe like the Python releases: their updater downloads this
    # asset (checked with SHA256SUMS.txt), so 2.x installs can update to v3.
    - name: Build the installer (bundles the signed app)
      shell: bash
      run: |
        echo '{"bundle": {"createUpdaterArtifacts": false}}' > "$RUNNER_TEMP/no-updater.json"
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" bundle --bundles nsis --config "$RUNNER_TEMP/no-updater.json"
        mkdir dist
        cp target/release/bundle/nsis/*-setup.exe dist/GoXLR_Setup.exe

    - name: Upload the setup for SignPath
      id: unsigned-setup
      if: env.SIGNPATH_API_TOKEN != ''
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-setup
        path: dist/GoXLR_Setup.exe

    - name: Sign the setup with SignPath
      if: env.SIGNPATH_API_TOKEN != ''
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
        github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signed-setup

    - name: Use the signed setup
      if: env.SIGNPATH_API_TOKEN != ''
      shell: pwsh
      run: |
        Copy-Item signed-setup/GoXLR_Setup.exe dist/GoXLR_Setup.exe -Force
        foreach ($file in @('target/release/goxlr-discord-sync.exe', 'dist/GoXLR_Setup.exe')) {
          $sig = Get-AuthenticodeSignature $file
          "{0}: {1} ({2})" -f $file, $sig.Status, $sig.SignerCertificate.Subject
          if ($null -eq $sig.SignerCertificate) { throw "Not signed: $file" }
        }

    - name: Updater signature
      shell: bash
      run: |
        if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
          echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (see README)"
          exit 1
        fi
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" signer sign dist/GoXLR_Setup.exe

    - uses: actions/upload-artifact@v7
      with:
        name: release-windows
        path: |
          dist/GoXLR_Setup.exe
          dist/GoXLR_Setup.exe.sig
        if-no-files-found: error

  release-linux:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7

    - name: Linux build dependencies
      run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Build the packages
      run: |
        echo '{"bundle": {"createUpdaterArtifacts": false}}' > "$RUNNER_TEMP/no-updater.json"
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --bundles deb appimage --config "$RUNNER_TEMP/no-updater.json"
        mkdir dist
        cp target/release/bundle/deb/*.deb dist/goxlr-discord-sync_amd64.deb
        cp target/release/bundle/appimage/*.AppImage dist/GoXLR_Discord_Sync_amd64.AppImage
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" signer sign dist/GoXLR_Discord_Sync_amd64.AppImage

    - uses: actions/upload-artifact@v7
      with:
        name: release-linux
        path: dist/*
        if-no-files-found: error

  publish:
    needs: [release-windows, release-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: release-*
        merge-multiple: true
        path: dist

    # latest.json is read by the updater of v3 (plugins.updater.endpoints).
    - name: Checksums and updater manifest
      working-directory: dist
      run: |
        sha256sum GoXLR_Setup.exe goxlr-discord-sync_amd64.deb GoXLR_Discord_Sync_amd64.AppImage > SHA256SUMS.txt
        base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        jq -n \
          --arg version "${GITHUB_REF_NAME#v}" \
          --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
          --arg win_sig "$(cat GoXLR_Setup.exe.sig)" --arg win_url "$base/GoXLR_Setup.exe" \
          --arg linux_sig "$(cat GoXLR_Discord_Sync_amd64.AppImage.sig)" --arg linux_url "$base/GoXLR_Discord_Sync_amd64.AppImage" \
          '{version: $version, notes: $notes, pub_date: $date, platforms: {
             "windows-x86_64": {signature: $win_sig, url: $win_url},
             "linux-x86_64": {signature: $linux_sig, url: $linux_url}}}' > latest.json
        cat latest.json SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/GoXLR_Setup.exe
          dist/goxlr-discord-sync_amd64.deb
          dist/GoXLR_Discord_Sync_amd64.AppImage
          dist/SHA256SUMS.txt
          dist/latest.json
        generate_release_notes: true
        body: |
          ## Installation
          **Windows:** download `GoXLR_Setup.exe` and run it. Versions 2.x update to this version from their tray menu.
          **Linux (x86_64):** `goxlr-discord-sync_amd64.deb` (Debian, Ubuntu) or `GoXLR_Discord_Sync_amd64.AppImage`.

          Requirements: GoXLR Utility and the Discord desktop app.
          Verify the download with `SHA256SUMS.txt`.

          ## Code signing policy
          Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/) (signed releases start once the project is accepted).
          See the [code signing policy](https://github.com/powange/goxlr-discord-sync#code-signing-policy) and the [privacy policy](https://github.com/powange/goxlr-discord-sync#privacy-policy).
