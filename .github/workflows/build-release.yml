name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'  # release on version tags (e.g. v2.0.0)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    - name: Tests
      run: pytest -q

  build:
    needs: test
    permissions:
      contents: write  # create the GitHub release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Check that the tag matches the version
      if: startsWith(github.ref, 'refs/tags/')
      shell: python
      run: |
        import os, sys
        sys.path.insert(0, ".")
        from goxlr_discord_sync import __version__
        tag = os.environ["GITHUB_REF_NAME"]
        if tag != f"v{__version__}":
            sys.exit(f"Tag {tag} does not match goxlr_discord_sync.__version__ ({__version__})")

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt

    - name: Build executables
      run: python build.py all

    - name: Create Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/GoXLR_Setup.exe
          dist/SHA256SUMS.txt
        generate_release_notes: true
        body: |
          ## Installation
          1. Download `GoXLR_Setup.exe`
          2. Run it and follow the setup wizard
          3. Approve the authorization request in Discord on first launch

          Requirements: Windows 10/11, GoXLR Utility, Discord desktop app.
          Verify the download with `SHA256SUMS.txt` (`certutil -hashfile GoXLR_Setup.exe SHA256`).

    - name: Upload artifacts
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: GoXLR_Setup
        path: |
          dist/GoXLR_Setup.exe
          dist/SHA256SUMS.txt
