[project]
name = "goxlr-discord-sync"
dynamic = ["version"]
description = "Mirror GoXLR mute controls to Discord voice settings"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"goxlr_discord_sync/i18n_fr.py" = ["E501"]  # one translation per line reads better
