[package]
name = "goxlr-discord-sync"
description = "Mirror your GoXLR mute controls to Discord"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "goxlr-discord-sync"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gds-core = { path = "../crates/core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tokio = { version = "1.54", features = ["rt", "sync", "time", "macros"] }
