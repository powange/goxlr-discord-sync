[package]
name = "gds-core"
description = "GoXLR Discord Sync engine: GoXLR Utility and Discord clients, sync rules, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
json-patch = "4.2"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.30"
url = "2.5"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros", "io-util", "test-util"] }
