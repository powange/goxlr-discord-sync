[package]
name = "goxlr-discord-sync-proto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prototype: measure a Rust GoXLR Discord Sync (tray, GoXLR Utility, Discord IPC, Cough -> mute)"

[dependencies]
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
json-patch = "4.2"
tray-icon = "0.26"
tao = "0.37"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
